project:
  name: srrtd
  seed: 42
  device: auto
  output_dir: outputs
  model_dir: models

data:
  # mode: single | multitask
  # - single: one dataset provides both risk+emotion labels (toy or custom)
  # - multitask: two separate datasets (risk-only + emotion-only), trained with alternating batches
  mode: single
  # source: toy | hf | csv | jsonl
  source: toy
  # Must be explicitly set to true before using non-toy datasets.
  dataset_confirmed: false
  # Optional: record external dataset details for your report/audit trail.
  confirmation:
    risk_dataset_name: ""
    risk_source: ""
    risk_license: ""
    emotion_dataset_name: ""
    emotion_source: ""
    emotion_license: ""

  # Multitask local datasets (used only when data.mode=multitask)
  multitask:
    risk:
      # format: csv | jsonl | xlsx (inferred from file extension if omitted)
      format: ""
      train_path: ""
      val_path: ""
      test_path: ""
      text_field: "text"
      label_field: "label"
      user_field: "user_id"
      time_field: "timestamp"
      # Optional explicit mapping for string labels (recommended).
      # Example: {"non-suicide": 0, "suicide": 1}
      label_map: {}
      # Optional caps to make very large datasets manageable.
      max_train_samples: -1
      max_val_samples: -1
      max_test_samples: -1
    emotion:
      format: ""
      train_path: ""
      val_path: ""
      test_path: ""
      text_field: "text"
      label_field: "emotion"
      user_field: "user_id"
      time_field: "timestamp"
      # Optional explicit mapping for string emotion labels.
      # If empty, labels.emotion_classes order is used.
      label_map: {}
      max_train_samples: -1
      max_val_samples: -1
      max_test_samples: -1

  cleaning:
    # Drop low-information / placeholder rows before caching/training.
    drop_deleted: true
    min_text_len: 10
    # If true, drops duplicate texts within each split.
    deduplicate: false
  # hf:
  hf_dataset_name: ""
  hf_dataset_config: ""
  hf_text_field: "text"
  hf_label_field: "label"
  # csv/jsonl:
  path: ""
  text_field: "text"
  label_field: "label"
  user_field: "user_id"
  time_field: "timestamp"

privacy:
  mask_emails: true
  mask_phones: true
  mask_urls: true
  mask_handles: true
  normalize_whitespace: true
  max_chars: 2048

labels:
  # risk classes in ascending severity
  risk_classes: ["low", "medium", "high"]
  # emotion classes (multi-class)
  emotion_classes: ["neutral", "sadness", "anger", "fear", "joy", "surprise", "disgust"]

model:
  encoder_name: "xlm-roberta-base"
  max_length: 256
  dropout: 0.1
  use_memory: true
  memory:
    short_window: 8
    long_ema_decay: 0.98
    user_state_dim: 256
  use_rag: true
  rag:
    embed_model: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
    embed_dim: 384
    top_k: 5
    chroma_dir: "outputs/chroma"
    collection: "srrtd_posts"
  use_gnn: true
  gnn:
    hidden_dim: 128
    num_layers: 2
    dropout: 0.1
    max_neighbors: 16

train:
  batch_size: 8
  lr: 2.0e-5
  weight_decay: 0.01
  epochs: 1
  warmup_ratio: 0.06
  fp16: false
  grad_accum: 1
  max_steps: -1
  val_ratio: 0.1
  test_ratio: 0.1
  loss_weights:
    risk: 1.0
    emotion: 0.5

inference:
  threshold_high: 0.55
  enable_support_module: true
  store_user_state: true
  state_ttl_seconds: 86400

experiments:
  baselines:
    - name: "full"
      encoder_name: "xlm-roberta-base"
      use_memory: true
      use_rag: true
      use_gnn: true
    - name: "singlepost_roberta"
      encoder_name: "roberta-base"
      use_memory: false
      use_rag: false
      use_gnn: false
    - name: "singlepost_xlmr"
      encoder_name: "xlm-roberta-base"
      use_memory: false
      use_rag: false
      use_gnn: false
  ablations:
    - name: "no_rag"
      use_rag: false
    - name: "no_gnn"
      use_gnn: false
    - name: "no_memory"
      use_memory: false
