project:
  name: srrtd
  seed: 42
  device: auto
  output_dir: outputs
  model_dir: models

data:
  mode: multitask
  # IMPORTANT: must be true to use any non-toy datasets.
  dataset_confirmed: true
  confirmation:
    risk_dataset_name: "<fill me>"
    risk_source: "<kaggle/hf/url or citation>"
    risk_license: "<license/access terms>"
    emotion_dataset_name: "<fill me>"
    emotion_source: "<hf dataset id/url>"
    emotion_license: "<license/access terms>"

  multitask:
    risk:
      train_path: data/raw/risk/train.csv
      val_path: data/raw/risk/val.csv
      test_path: data/raw/risk/test.csv
      text_field: text
      label_field: class
      label_map:
        non-suicide: 0
        suicide: 1
      extra_train_paths: [data/raw/risk/hard_negatives.csv]
      extra_train_repeat: 5
      max_extra_train_samples: -1
      # Use more data (increase further if RAM/time allow).
      max_train_samples: 200000
      max_val_samples: 10000
      max_test_samples: 10000

    emotion:
      train_path: data/raw/emotion/train.csv
      val_path: data/raw/emotion/val.csv
      test_path: data/raw/emotion/test.csv
      text_field: text
      label_field: label
      # Use more data (increase further if RAM/time allow).
      max_train_samples: 200000
      max_val_samples: 10000
      max_test_samples: 10000

  cleaning:
    drop_deleted: true
    min_text_len: 10
    deduplicate: false

privacy:
  mask_emails: true
  mask_phones: true
  mask_urls: true
  mask_handles: true
  normalize_whitespace: true
  max_chars: 2048

labels:
  risk_classes: ["non-suicide", "suicide"]
  emotion_classes: ["sadness", "joy", "love", "anger", "fear", "surprise"]

model:
  encoder_name: xlm-roberta-base
  max_length: 256
  dropout: 0.1
  use_memory: true
  memory:
    short_window: 8
    long_ema_decay: 0.98
    user_state_dim: 256
  use_rag: true
  rag:
    embed_model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
    embed_dim: 384
    top_k: 5
    chroma_dir: outputs/chroma
    collection: srrtd_posts
  use_gnn: true
  gnn:
    hidden_dim: 128
    num_layers: 2
    dropout: 0.1
    max_neighbors: 200

train:
  batch_size: 16
  lr: 2.0e-5
  weight_decay: 0.01
  # Keep epochs high; max_steps is the true runtime cap.
  epochs: 50
  warmup_ratio: 0.06
  fp16: true
  grad_accum: 1
  # ~30k steps at ~5s/step ≈ 42 hours (+val) on your setup.
  max_steps: 30000
  loss_weights:
    risk: 1.0
    emotion: 1.0
  multitask:
    # Balanced from-scratch multitask.
    p_emotion: 0.5
    # Important: don't let 'epoch' become enormous with 200k+ risk rows.
    # This keeps validation/checkpointing frequent and predictable.
    steps_per_epoch: 2000

inference:
  threshold_high: 0.55
  enable_support_module: true
  store_user_state: true
  state_ttl_seconds: 86400
